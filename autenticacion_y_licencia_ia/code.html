  // Interactive Microfeedback for Google OAuth
  const googleOAuthBtn = document.getElementById('googleOAuthBtn');
  if (googleOAuthBtn) {
    googleOAuthBtn.addEventListener('click', () => {
      googleOAuthBtn.style.transform = 'scale(0.99)';
      setTimeout(() => {
        googleOAuthBtn.style.transform = 'none';
